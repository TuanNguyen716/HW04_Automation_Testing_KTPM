<!doctype html>
<meta charset="utf-8">
<title>Demo - Sign in</title>
<h1>Sign in</h1>
<form id="f">
  <p><label for="email">Email</label>
     <input id="email" name="email" type="email" required></p>
  <p><label for="password">Password</label>
     <input id="password" name="password" type="password"></p>
  <button type="submit">Sign in</button>
</form>
<div id="err" role="alert" hidden></div>
<script>
  // Fictional credentials - demo only.
  const USER = { email: 'test@demo.com', password: 'Test1234!' };
  const err = document.getElementById('err');
  document.getElementById('f').addEventListener('submit', (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    if (!password) return fail('Password is required');
    if (email !== USER.email || password !== USER.password) return fail('Invalid email or password');
    location.href = 'dashboard.html';
  });
  function fail(msg) { err.textContent = msg; err.hidden = false; }
</script>
